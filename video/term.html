<!doctype html><html><head><meta charset="utf-8"><style>
  body{margin:0;background:#0d1117;color:#e6edf3;font:15px/1.55 ui-monospace,Menlo,monospace;padding:28px 34px}
  .t{white-space:pre-wrap;word-break:break-all}
  .cmd{color:#79c0ff}.out{color:#8b949e}.hl{color:#3fb950;font-weight:700}.pp{color:#58a6ff;font-weight:700}
  #cursor{display:inline-block;width:9px;height:17px;background:#e6edf3;animation:b 1s steps(1) infinite;vertical-align:-2px}
  @keyframes b{50%{opacity:0}}
  #cap{position:fixed;left:0;right:0;bottom:0;padding:10px 18px;background:rgba(13,17,23,.96);border-top:2px solid #0070e0;font:14px/1.4 -apple-system,Segoe UI,sans-serif;color:#c9d1d9}
  #cap b{color:#fff}
</style></head><body><div id="t" class="t"></div><span id="cursor"></span><div id="cap"></div><script>
const t=document.getElementById('t');
window.term=(lines)=>{for(const l of lines){const d=document.createElement('div');d.className=l.startsWith('$')?'cmd':(l.startsWith('!')?'hl':(l.startsWith('@')?'pp':'out'));d.textContent=l.startsWith('!')||l.startsWith('@')?l.slice(1):l;t.appendChild(d);}window.scrollTo(0,1e6);};
window.cap=(s)=>{document.getElementById('cap').innerHTML=s;};
</script></body></html>
