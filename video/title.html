<!doctype html><html><head><meta charset="utf-8"><style>
  body{margin:0;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#0d1117;color:#e6edf3;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  h1{font-size:44px;margin:0 0 14px}
  h1 .pp{color:#0070e0}
  p{font-size:20px;color:#8b949e;max-width:900px;text-align:center;line-height:1.5}
  .tag{margin-top:26px;display:flex;gap:10px}
  .tag span{border:1px solid #30363d;border-radius:20px;padding:6px 16px;font-size:14px;color:#c9d1d9}
  .tag .p{background:#003087;border-color:#003087;color:#fff;font-weight:700}
</style></head><body><h1 id="h"></h1><p id="s"></p><div class="tag" id="g"></div><script>
const q=new URLSearchParams(location.search);
document.getElementById('h').innerHTML=q.get('t')||'Slop.cash · verified-work payouts';
document.getElementById('s').textContent=q.get('s')||'';
const tags=(q.get('g')||'').split('|').filter(Boolean);
for(const x of tags){const e=document.createElement('span');e.textContent=x;if(/paypal/i.test(x))e.className='p';document.getElementById('g').appendChild(e);}
</script></body></html>
